# Dependabot keeps deps fresh + flags vulnerabilities.
#
# Strategy:
# - Plugin npm deps + example npm deps: weekly grouped updates so we get one
#   PR per week per ecosystem instead of a flood.
# - GitHub Actions: weekly. Every `uses:` in .github/workflows is pinned to a
#   full commit SHA with a trailing `# vX.Y.Z` comment; Dependabot updates SHA
#   pins natively and rewrites the comment along with them.
# - The plugin's *Braze SDK* version pins are NOT auto-bumped — those follow
#   the policy in SDK_SURFACE.md §4 (manual per Braze SDK release notes).
# - `@capacitor/*` majors are NO LONGER ignored. Until 0.3.0 they were, because
#   the plugin capped at Capacitor 7 and a Cap 8 bump in demo/ or example/
#   would have broken against the podspec's `< 8.0` range. The plugin now
#   tracks current Capacitor (peer `^6 || ^7 || ^8`, podspec `< 9.0`), and both
#   apps are on 8.x, so the ignore rule only hid drift. Majors are still
#   maintainer-verified rather than auto-merged: a Capacitor 9 PR has to get
#   past `verify-ios` (CocoaPods + SPM) and `verify-android`, and it is not
#   mergeable until the peer range, the podspec range and the
#   `capacitor-swift-pm` range in Package.swift are widened by hand.

version: 2
updates:
  # Plugin dev dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        applies-to: version-updates
        patterns:
          - '*'

  # Example app deps (Vite, TS, Capacitor)
  - package-ecosystem: 'npm'
    directory: '/example'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      example-deps:
        applies-to: version-updates
        patterns:
          - '*'

  # Demo app deps (React, TanStack, Tailwind, Capacitor)
  - package-ecosystem: 'npm'
    directory: '/demo'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      demo-deps:
        applies-to: version-updates
        patterns:
          - '*'

  # Mock-server deps (Fastify, tsx, TypeScript).
  # A4-16 / A5-08: this was declared as `gradle` — a leftover from the
  # never-built Ktor plan — so Dependabot failed every weekly run with
  # "No files found in /test/mock-server" and the actual npm deps went
  # unmonitored.
  - package-ecosystem: 'npm'
    directory: '/test/mock-server'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      mock-server-deps:
        applies-to: version-updates
        patterns:
          - '*'

  # Web-test deps (vitest, jsdom, @braze/web-sdk, TypeScript).
  # A5-08 secondary / L7-05: previously under no Dependabot coverage at all.
  - package-ecosystem: 'npm'
    directory: '/test/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      web-test-deps:
        applies-to: version-updates
        patterns:
          - '*'

  # GitHub Actions versions. Workflows pin full commit SHAs; Dependabot
  # bumps the SHA and the trailing `# vX.Y.Z` comment together.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
