# Dependabot keeps deps fresh + flags vulnerabilities.
#
# Strategy:
# - Plugin npm deps + example npm deps: weekly grouped updates so we get one
#   PR per week per ecosystem instead of a flood.
# - GitHub Actions: weekly, pinned by SHA where possible (supply-chain hygiene).
# - The plugin's *Braze SDK* version pins are NOT auto-bumped — those follow
#   the policy in SDK_SURFACE.md §4 (manual per Braze SDK release notes).
# - `@capacitor/*` major bumps are ignored across all ecosystems. The plugin
#   supports Capacitor 6 + 7 per its peer dep range; bumping the example/demo
#   apps to Capacitor 8 would force a JDK 21 baseline (Capacitor 8 raised the
#   AGP/JDK minimum) and break the plugin's own podspec range. Capacitor
#   majors land via a deliberate maintainer-driven migration, not via
#   Dependabot.

version: 2
updates:
  # Plugin dev dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']
    groups:
      dev-deps:
        applies-to: version-updates
        patterns:
          - '*'

  # Example app deps (Vite, TS, Capacitor)
  - package-ecosystem: 'npm'
    directory: '/example'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']
    groups:
      example-deps:
        applies-to: version-updates
        patterns:
          - '*'

  # Demo app deps (React, TanStack, Tailwind, Capacitor)
  - package-ecosystem: 'npm'
    directory: '/demo'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']
    groups:
      demo-deps:
        applies-to: version-updates
        patterns:
          - '*'

  # Mock-server Gradle deps (Ktor, JUnit)
  - package-ecosystem: 'gradle'
    directory: '/test/mock-server'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5

  # GitHub Actions versions (per SECURITY.md §13: SHA-pinned via Dependabot)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
