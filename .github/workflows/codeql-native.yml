name: CodeQL (native)

# Static analysis (SAST) for the two native bridges — the half of the plugin
# `codeql.yml` cannot reach:
#
#   analyze-kotlin  java-kotlin  android/src/main   (ubuntu-latest)
#   analyze-swift   swift        ios/Sources        (macos-latest)
#
# ---------------------------------------------------------------------------
# Why this is its own workflow
# ---------------------------------------------------------------------------
# `codeql.yml` analyses JavaScript/TypeScript and the workflow files with
# `build-mode: none`: no compiler, a couple of minutes on ubuntu. Kotlin and
# Swift cannot be analysed that way. CodeQL extracts them by tracing a real
# compilation, so each job here re-does most of the setup of its `test.yml`
# twin (verify-android / verify-ios): Node, the plugin build, the demo's web
# build, `cap sync`, the JDK + Android SDK or the pinned Xcode + CocoaPods.
# Keeping that in a separate file keeps the fast workflow fast and lets each
# native job be skipped on PRs that cannot affect it (see `changes` below).
#
# ---------------------------------------------------------------------------
# How the analysis is scoped to the plugin's own code
# ---------------------------------------------------------------------------
# A traced build extracts every file the compiler touches. Built naively, the
# Swift database holds ~130 files that are not ours (Capacitor's sources under
# demo/node_modules, Pods, the demo app) and the Kotlin one would hold
# Capacitor's Java — and `paths` / `paths-ignore` in a CodeQL config do NOT
# filter a traced compile (GitHub's docs: for compiled languages "you must
# specify appropriate build steps"). So each job builds in two passes:
#
#   1. Untraced prebuild, BEFORE `codeql-action/init`: compiles Capacitor, the
#      Braze pods and the demo app, leaving their outputs up to date.
#   2. Traced build, AFTER init: recompiles only the plugin. Kotlin uses
#      Gradle's `--rerun` on `:capacitor-braze:compileDebugKotlin` alone;
#      Swift touches `ios/Sources/BrazePlugin/*.swift` and rebuilds, so
#      Xcode's dependency analysis recompiles exactly that target.
#
# Verified locally with CodeQL 2.27.1 (the bundle pinned by codeql-action
# v4.38.1): the Swift database's source archive is BrazePlugin.swift +
# BrazeIAMDelegate.swift and nothing else; the Kotlin one is BrazePlugin.kt
# plus the plugin's AndroidManifest.xml. `.github/codeql/codeql-config.yml`
# explains the one place a `paths` filter does still matter (the java-kotlin
# extractor's XML walk).
#
# The Swift job analyses the CocoaPods build of `ios/Sources`. The SPM build
# (`verify-ios`'s second leg) compiles the same two files; analysing both would
# double the macOS time for an identical database.
#
# ---------------------------------------------------------------------------
# Cost
# ---------------------------------------------------------------------------
# analyze-swift runs on macos-latest and is the expensive half: the untraced
# prebuild (Capacitor + BrazeKit/BrazeUI via CocoaPods) is most of it, the
# traced plugin rebuild + analysis add a few minutes. analyze-kotlin is an
# ubuntu job of similar shape to verify-android minus the tests. Both are
# skipped on pull requests that touch nothing they read (the `changes` job),
# and always run on push to main and on the weekly schedule — so the Security
# tab's baseline for main never goes stale.
#
# A job skipped by `if:` reports as "Skipped", which satisfies a required
# status check. That is why the gate is a job rather than a workflow-level
# `on.pull_request.paths` filter, which would leave a required check pending
# forever on a docs-only PR. The cost of skipping: on such a PR, GitHub's
# code-scanning check may note that the java-kotlin / swift configurations from
# main were not found on the PR. That is informational, not a failure.
#
# ---------------------------------------------------------------------------
# Toolchain drift
# ---------------------------------------------------------------------------
# CodeQL supports a bounded compiler range (at 2.27.1: Swift 5.4-6.3, Kotlin
# 1.8.0-2.4.20). Xcode 26.6 ships Swift 6.3 and android/build.gradle pins
# Kotlin 2.2.20. If macos-latest moves to an Xcode whose Swift is newer than
# the bundled CodeQL supports, analyze-swift fails at extraction — bump
# github/codeql-action (every init/analyze SHA, here and in codeql.yml, in
# the same commit) rather than un-pinning DEVELOPER_DIR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Same slot as codeql.yml (Mondays 05:27 UTC): newly published CodeQL
    # queries re-run against unchanged code.
    - cron: '27 5 * * 1'

# Least privilege at the file level; the analyse jobs widen only what CodeQL
# needs to upload results.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR commit should cancel its in-flight analysis; a push to
  # main or a scheduled run should always complete and post its results.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides, for pull requests only, which native analyses the change can
  # affect. Push and schedule runs always analyse both.
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      kotlin: ${{ steps.filter.outputs.kotlin }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      # On pull_request the checked-out commit is GitHub's test merge commit;
      # depth 2 brings its first parent (the base branch tip), so
      # `HEAD^1..HEAD` is exactly the PR's change set.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "kotlin=true" >> "$GITHUB_OUTPUT"
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: analysing both languages."
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$CHANGED"
          # Inputs to both builds: this workflow, the CodeQL config, and the
          # demo's lockfile (it pins the Capacitor version both builds use).
          SHARED='^(\.github/workflows/codeql-native\.yml|\.github/codeql/|demo/package(-lock)?\.json$)'
          KOTLIN='^(android/|demo/android/)'
          SWIFT='^(ios/|Package\.swift$|CapacitorBraze\.podspec$|demo/ios/)'
          if grep -qE "$SHARED|$KOTLIN" <<< "$CHANGED"; then k=true; else k=false; fi
          if grep -qE "$SHARED|$SWIFT" <<< "$CHANGED"; then s=true; else s=false; fi
          echo "kotlin=$k" >> "$GITHUB_OUTPUT"
          echo "swift=$s" >> "$GITHUB_OUTPUT"
          echo "kotlin=$k swift=$s"

  analyze-kotlin:
    name: Analyze (java-kotlin)
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    # Backstop against a hung Gradle daemon; a normal run is well under this.
    timeout-minutes: 30
    permissions:
      security-events: write # upload SARIF to the Security tab
      contents: read # checkout
      actions: read # read workflow run metadata (required for private/internal repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      # Same toolchain as verify-android: JDK 21, JVM 17 bytecode.
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep in step with verify-android (compileSdk 36 / build-tools 36.0.0).
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install plugin deps + build
        run: |
          npm ci
          npm run build

      - name: Install demo deps + build web assets
        working-directory: demo
        run: |
          npm ci
          npm run build

      - name: Capacitor sync (wires :capacitor-braze into the demo's Gradle build)
        working-directory: demo
        run: npx cap sync android

      # Pass 1 — untraced. Compiles :capacitor-android and every other input
      # of the plugin's compile so pass 2 finds them up to date and they never
      # reach the database. The in-process Kotlin strategy keeps a Kotlin
      # daemon from outliving this step and serving pass 2 outside the tracer.
      - name: Prebuild dependencies (untraced)
        working-directory: demo/android
        run: ./gradlew :capacitor-braze:compileDebugKotlin --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      # Pass 2 — traced. `--rerun` forces this one task (and only this task)
      # to recompile from scratch; --no-daemon and the in-process compiler
      # keep kotlinc inside the traced process tree.
      - name: Compile the plugin (traced)
        working-directory: demo/android
        run: ./gradlew :capacitor-braze:compileDebugKotlin --rerun --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:java-kotlin'

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    # Backstop: a stuck `pod install` or xcodebuild would otherwise hold a
    # macOS runner for the 6-hour default.
    timeout-minutes: 60
    permissions:
      security-events: write # upload SARIF to the Security tab
      contents: read # checkout
      actions: read # read workflow run metadata (required for private/internal repos)
    env:
      # Same pin + fallback as verify-ios: BrazeKit 18.x requires Xcode 26+,
      # and macos-latest's default moves as the image is rebuilt.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Select Xcode 26.x
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::warning::$DEVELOPER_DIR not present on this image; selecting the newest installed Xcode 26.x."
            FALLBACK=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -z "$FALLBACK" ]; then
              echo "::error::No Xcode 26.x found on the runner. BrazeKit 18.x requires Xcode 26+."
              exit 1
            fi
            echo "DEVELOPER_DIR=$FALLBACK" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$FALLBACK"
          fi
          echo "Using DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version | head -2
          swift --version | head -1
          pod --version

      - name: Install plugin deps + build
        run: |
          npm ci
          npm run build

      - name: Install demo deps + build web assets
        working-directory: demo
        run: |
          npm ci
          npm run build

      - name: Capacitor sync (copies web assets + runs pod install)
        working-directory: demo
        env:
          LANG: en_US.UTF-8
        run: npx cap sync ios

      # Pass 1 — untraced. Builds Capacitor, CapacitorCordova, the Braze pods
      # and the demo app into a known DerivedData, so pass 2 only recompiles
      # what it is told to.
      - name: Prebuild dependencies (untraced)
        working-directory: demo/ios/App
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: swift
          build-mode: manual

      # Pass 2 — traced. Touching the plugin's sources makes Xcode recompile
      # the CapacitorBraze target and nothing upstream of it; the demo's own
      # AppDelegate is not recompiled (verified locally), so the database is
      # the plugin's two Swift files.
      - name: Rebuild the plugin (traced)
        working-directory: demo/ios/App
        run: |
          set -euo pipefail
          touch "$GITHUB_WORKSPACE"/ios/Sources/BrazePlugin/*.swift
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:swift'
