name: CodeQL

# A4-14 / REVIEW_READINESS §2 — static analysis (SAST).
#
# Until 0.2.0 the only scanners on this repo were `npm audit`, gitleaks and
# GitHub secret scanning: dependency and secret hygiene, no analysis of the
# code itself. SECURITY.md §12 said so plainly rather than implying otherwise.
# This workflow closes that gap for the two languages that can be analysed
# without a build.
#
# ---------------------------------------------------------------------------
# Where Swift and Kotlin are analysed
# ---------------------------------------------------------------------------
# In `codeql-native.yml`, not here. CodeQL extracts Swift and Kotlin only by
# tracing a real compile — `xcodebuild` on macOS with the BrazeKit/BrazeUI pods
# resolved, Gradle with the Android SDK installed — so those jobs repeat most
# of verify-ios / verify-android's setup and take minutes, not seconds. Keeping
# them in their own workflow keeps this one fast and lets each native job be
# skipped on a PR that cannot affect it. That file's header explains how the
# traced builds are scoped to the plugin's own sources.
#
# `actions` analyses these workflow files themselves — untrusted-input
# injection into `run:` blocks, over-broad permissions, the
# `pull_request_target` footguns. That is worth having on a repo whose CI
# publishes to npm.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:27 UTC. Weekly re-analysis catches newly published CodeQL
    # queries firing on code that has not changed. Off-the-hour to avoid the
    # top-of-hour scheduling backlog.
    - cron: '27 5 * * 1'

# Least privilege at the file level; the analyse job widens only what CodeQL
# needs to upload results.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR commit should cancel its in-flight analysis; a push to
  # main or a scheduled run should always complete and post its results.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      contents: read # checkout
      actions: read # read workflow run metadata (required for private/internal repos)
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `build-mode: none` is the supported replacement for the old
      # autobuild step for languages CodeQL can analyse from source. Neither
      # of these languages compiles, so there is no autobuild to run.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
