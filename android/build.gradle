ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Two independent floors stack here; the higher one wins.
        //
        //  * Braze. `com.braze:android-sdk-ui` 43.x ships Kotlin 2.2.0
        //    metadata, so the Kotlin plugin must be >= 2.2.0 or every Braze
        //    class fails with "incompatible version of Kotlin". Its
        //    transitive androidx.swiperefreshlayout:1.2.0 needs AGP >= 8.6.0
        //    and its androidx.recyclerview:1.4.0 needs compileSdk >= 35.
        //    The 43.2.0 AARs themselves declare only
        //    minAndroidGradlePluginVersion=1.0.0 / minCompileSdk=21.
        //  * Capacitor 8. `@capacitor/android` 8.5.2 builds `:capacitor-android`
        //    with AGP 8.13.0, compileSdk 36, minSdk 24, targetSdk 36 and
        //    Java 21 (see demo/node_modules/@capacitor/android/capacitor/build.gradle),
        //    and its project template ships Gradle 8.14.3.
        //
        // So the defaults below are Capacitor 8's, which are >= Braze's
        // everywhere. Capacitor 6/7 consumers keep working because every
        // `android {}` value is read from `rootProject.ext` first — their
        // stock `variables.gradle` (compileSdk 34/35, minSdk 22) still wins.
        // See C10 for the full matrix.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
// C11 / C09: coverage for the Robolectric unit tier. Applying the plugin only
// registers tasks and an agent configuration that resolves when this module's
// own tests run, so a consumer's app build never touches it.
apply plugin: 'jacoco'

android {
    namespace "com.bma342.braze"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        // Standalone defaults match Capacitor 8's stock template (the newest
        // Capacitor major the peer dep allows) and the values C10 documents;
        // a consumer's rootProject.ext always wins, which is what keeps
        // Capacitor 6/7 projects on their own lower numbers.
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        // C09: Android Lint is the Kotlin half of the quality gate, and a
        // gate that can't fail the build isn't one. Warnings stay
        // advisory; errors stop CI.
        abortOnError true
        warningsAsErrors false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        // Phase 15 / C11: enable Robolectric for the JVM unit-test tier.
        // includeAndroidResources lets Robolectric synthesize a working
        // Android context for tests that touch the BrazePlugin lifecycle.
        unitTests {
            includeAndroidResources = true
        }
    }
}

// Kotlin 2.x replacement for the deprecated android.kotlinOptions block.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Required on the compile classpath, not merely transitive:
    // Capacitor's Bridge.getActivity() is typed AppCompatActivity, and
    // :capacitor-android declares appcompat with `implementation`, so it
    // is not exported to consumers of that project.
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    // Braze native SDK pins — see SDK_SURFACE.md §4 (pinning policy) and C08.
    implementation 'com.braze:android-sdk-ui:43.2.0'
    testImplementation "junit:junit:$junitVersion"
    // Phase 15 / C11 native-harness deps. Robolectric runs the JVM
    // test tier against a synthesized Android context so the plugin's
    // validation surface + lifecycle helpers can be exercised without
    // an instrumented device.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'com.google.truth:truth:1.4.4'
    // C11 integration tier: a real local HTTP server the Braze SDK's own
    // networking stack talks to, so tests assert the bytes that reached the
    // wire rather than the bridge's intent. MockWebServer 4.x matches the
    // OkHttp 4.x line the Braze SDK already pulls in transitively.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

// ---------------------------------------------------------------------------
// Coverage ratchet (C11 "Coverage", C09 gates table).
//
//   ./gradlew :capacitor-braze:testDebugUnitTest \
//             :capacitor-braze:jacocoTestReport \
//             :capacitor-braze:jacocoCoverageVerification
//
// The report covers the bridge's own compiled classes — BrazePlugin.kt and
// the Kotlin synthetics it produces — and nothing generated (R, BuildConfig,
// Manifest). The minimums sit just below the measured numbers recorded in
// docs/TEST-COVERAGE-AUDIT.md and may only move up: when a change lowers the
// measured value, add tests rather than lowering the floor.
// ---------------------------------------------------------------------------
jacoco {
    toolVersion = '0.8.15'
}

tasks.withType(Test).configureEach {
    jacoco {
        // Robolectric loads the classes under test through its own sandbox
        // class loader, which JaCoCo treats as "no location" and skips by
        // default — without this the report is empty rather than wrong.
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

def coverageExcludes = [
    '**/R.class',
    '**/R$*.class',
    '**/BuildConfig.*',
    '**/Manifest*.*',
]
def coverageClassDirs = files(
    fileTree(layout.buildDirectory.dir('tmp/kotlin-classes/debug')) { exclude coverageExcludes },
    fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) { exclude coverageExcludes },
)
def coverageExecData = files(layout.buildDirectory.file('jacoco/testDebugUnitTest.exec'))

tasks.register('jacocoTestReport', JacocoReport) {
    group = 'verification'
    description = 'JaCoCo XML + HTML report for the Robolectric unit tier (testDebugUnitTest).'
    dependsOn 'testDebugUnitTest'
    classDirectories.setFrom(coverageClassDirs)
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(coverageExecData)
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register('jacocoCoverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails the build when BrazePlugin coverage drops below the ratcheted floor.'
    dependsOn 'testDebugUnitTest'
    classDirectories.setFrom(coverageClassDirs)
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(coverageExecData)
    violationRules {
        // Measured 2026-09-28 at 0.3.0 (106 tests): LINE 600/668 = 89.82%,
        // BRANCH 433/567 = 76.37%. Floors are the measured value rounded
        // down to the whole percent; raise them when coverage improves.
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.89
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.76
            }
        }
    }
}
